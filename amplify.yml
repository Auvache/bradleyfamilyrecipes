version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Pin Node before `npm ci` so better-sqlite3's native binding is built
        # for the ABI the build phase will run under. AL2023's default is 22, but
        # pinning keeps this stable when AWS moves the default. Must stay in sync
        # with .nvmrc. Note: better-sqlite3 12.x does not compile on Node 26+
        # (uses v8::PropertyCallbackInfo::This(), removed in V8 14).
        - nvm use 22
        - node -v
        - npm ci
    build:
      commands:
        # NITRO_PRESET=static is required, not optional. Amplify sets AWS_APP_ID
        # on every build, which std-env reports as provider "aws_amplify", so
        # nitro auto-selects its aws-amplify preset and writes .amplify-hosting/
        # (an SSR bundle) instead of .output/public — even under `nuxt generate`.
        - NITRO_PRESET=static npm run generate
  artifacts:
    baseDirectory: .output/public
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .npm/**/*
